<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Langkawi Checklist</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(#7fd3ff,#eefbff);padding:20px}
.card{max-width:430px;margin:auto;background:#ffffffdd;border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.item{display:flex;gap:12px;align-items:center;background:#fff;padding:12px;border-radius:14px;margin:8px 0}
.item:has(input:checked){background:#e8fbff}
.progressbar{height:12px;background:#d8eef8;border-radius:99px;overflow:hidden}.progress{height:100%;width:0;background:#0096c7}
button{width:100%;padding:14px;border:none;border-radius:14px;background:#0b84c6;color:#fff}
</style></head><body><div class="card">
<h1>🏝️ Langkawi</h1><p>土曜日チェックリスト</p>
<div class="progressbar"><div class="progress" id="p"></div></div><p id="t"></p>
<div id="list"></div><button onclick="resetList()">リセット</button></div>
<script>
const items=[
"飛行機（旅程・搭乗券確認）","ホテル予約確認","ダタイにメールする","スキンケア","サンダル","服","薬","モバイルチャージャー","ネックピロー","耳栓","アイマスク","パスポート","変圧器（家のを確認）","緩衝材","ビオフェルミン","マスク","⭐ eSIM（重要）","スープ・お菓子","パンツ（ゆうきのみ）","本"];
const list=document.getElementById("list");
items.forEach((txt,i)=>{const d=document.createElement("div");d.className="item";d.innerHTML=`<input type=checkbox id=c${i}><label for=c${i}>${txt}</label>`;list.appendChild(d);const c=d.querySelector("input");c.checked=localStorage.getItem(c.id)==="true";updItem(c);c.onchange=()=>{localStorage.setItem(c.id,c.checked);updItem(c);upd()}});
function updItem(c){c.parentElement.classList.toggle("checked",c.checked)}
function upd(){const cs=[...document.querySelectorAll("input")];const done=cs.filter(x=>x.checked).length;document.getElementById("p").style.width=(done/cs.length*100)+"%";document.getElementById("t").textContent=`${done} / ${cs.length} 完了`}
function resetList(){if(confirm("リセットしますか？")){document.querySelectorAll("input").forEach(c=>{c.checked=false;localStorage.removeItem(c.id);updItem(c)});upd()}}
upd();
</script></body></html>
